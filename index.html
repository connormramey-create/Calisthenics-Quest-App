<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS Web App PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cali RPG">
    <meta name="theme-color" content="#0F172A">
    
    <title>Calisthenics RPG - Skill Tree & Quest System</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#141E33',
                            950: '#0B0F19',
                        },
                        amber: {
                            450: '#F59E0B',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Custom Safe Area Padding for iOS Notch & Home Bar */
        .pt-safe {
            padding-top: env(safe-area-inset-top, 1rem);
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 1rem);
        }
        .top-safe {
            top: env(safe-area-inset-top, 0px);
        }

        /* Custom Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(71, 85, 105, 1);
        }

        /* Pulse Animations for Active Timers */
        @keyframes subtle-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.98); }
        }
        .timer-pulse {
            animation: subtle-pulse 1.5s infinite ease-in-out;
        }

        /* Prevent text selection on quick interactive taps */
        .no-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-slate-950 no-select pb-safe">

    <!-- -->
    <!-- MAIN NAVIGATION & HERO STATUS BAR -->
    <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 pt-safe px-4 py-3 shadow-lg">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            
            <!-- App Logo & Level Stats -->
            <div class="flex items-center justify-between w-full sm:w-auto gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-yellow-400 flex items-center justify-center text-slate-950 font-black text-xl shadow-md shadow-amber-500/20">
                        <i class="fa-solid font-black fa-shield-halved"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold tracking-wide text-slate-100 leading-tight">CALISTHENICS <span class="text-amber-400">RPG</span></h1>
                        <p class="text-xs text-slate-400">Rank: <span id="player-rank" class="text-amber-300 font-semibold">Novice Initiate</span></p>
                    </div>
                </div>

                <!-- Level Badge (Mobile Right) -->
                <div class="sm:hidden flex flex-col items-end">
                    <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Level</span>
                    <span id="mobile-level-num" class="text-xl font-extrabold text-amber-400">1</span>
                </div>
            </div>

            <!-- XP Progress Bar & Stats Pill -->
            <div class="w-full sm:w-80 flex flex-col gap-1.5">
                <div class="flex justify-between items-center text-xs font-semibold">
                    <span class="text-slate-300 flex items-center gap-1.5">
                        <span id="desktop-level-badge" class="hidden sm:inline-block px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">LVL <span id="level-num">1</span></span>
                        <span>XP Progress</span>
                    </span>
                    <span class="text-slate-400"><span id="current-xp" class="text-amber-400">0</span> / <span id="next-level-xp">100</span> XP</span>
                </div>
                <div class="w-full h-3 bg-slate-800 rounded-full overflow-hidden p-0.5 border border-slate-700/60 shadow-inner">
                    <div id="xp-bar-fill" class="h-full bg-gradient-to-r from-amber-500 to-yellow-300 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>
            </div>

            <!-- Global Action Controls (Export/Import & Reset) -->
            <div class="hidden md:flex items-center gap-2">
                <button onclick="exportData()" title="Backup Progress" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">
                    <i class="fa-solid fa-download text-sm"></i>
                </button>
                <label title="Restore Progress" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition cursor-pointer">
                    <i class="fa-solid fa-upload text-sm"></i>
                    <input type="file" id="import-file" class="hidden" onchange="importData(event)" accept=".json">
                </label>
                <button onclick="confirmReset()" title="Reset Character" class="p-2 rounded-lg bg-red-950/40 hover:bg-red-900/60 text-red-400 border border-red-800/50 transition">
                    <i class="fa-solid fa-rotate-left text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- -->
    <!-- MAIN APPLICATION CONTAINER -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">

        <!-- Top Action Card: Quest Generator Launcher -->
        <section class="bg-gradient-to-br from-slate-900 via-slate-850 to-slate-900 rounded-2xl p-5 border border-amber-500/30 shadow-xl relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 relative z-10">
                <div class="space-y-1">
                    <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-semibold uppercase tracking-wider">
                        <i class="fa-solid fa-scroll text-xs"></i> Daily Workout Guild
                    </div>
                    <h2 class="text-xl md:text-2xl font-bold text-slate-100">Ready for Today's Quest?</h2>
                    <p class="text-sm text-slate-400">Generate a balanced training regimen scaled automatically to your unlocked skills.</p>
                </div>

                <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                    <select id="quest-focus-select" class="bg-slate-950 text-slate-200 text-sm rounded-xl px-3 py-2.5 border border-slate-700 focus:outline-none focus:border-amber-500 flex-1 md:flex-none">
                        <option value="full">Full Body Quest</option>
                        <option value="push">Push Specialization</option>
                        <option value="pull">Pull Specialization</option>
                        <option value="core">Core & Isometric</option>
                        <option value="legs">Legs & Lower Body</option>
                    </select>

                    <button onclick="generateWorkoutQuest()" class="w-full md:w-auto px-5 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold text-sm shadow-lg shadow-amber-500/20 active:scale-95 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Quest
                    </button>
                </div>
            </div>
        </section>

        <!-- Skill Branch Selector Tabs -->
        <nav class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none border-b border-slate-800">
            <button onclick="switchBranch('push')" id="tab-push" class="branch-tab active px-4 py-2.5 rounded-xl font-bold text-sm whitespace-nowrap transition flex items-center gap-2 bg-amber-500 text-slate-950 shadow-md">
                <i class="fa-solid fa-hand-fist"></i> Push Branch
            </button>
            <button onclick="switchBranch('pull')" id="tab-pull" class="branch-tab px-4 py-2.5 rounded-xl font-bold text-sm whitespace-nowrap transition flex items-center gap-2 bg-slate-800/80 text-slate-400 hover:bg-slate-800 hover:text-slate-200">
                <i class="fa-solid fa-person-arrow-up-from-line"></i> Pull Branch
            </button>
            <button onclick="switchBranch('core')" id="tab-core" class="branch-tab px-4 py-2.5 rounded-xl font-bold text-sm whitespace-nowrap transition flex items-center gap-2 bg-slate-800/80 text-slate-400 hover:bg-slate-800 hover:text-slate-200">
                <i class="fa-solid fa-shield-cat"></i> Core & Isometrics
            </button>
            <button onclick="switchBranch('legs')" id="tab-legs" class="branch-tab px-4 py-2.5 rounded-xl font-bold text-sm whitespace-nowrap transition flex items-center gap-2 bg-slate-800/80 text-slate-400 hover:bg-slate-800 hover:text-slate-200">
                <i class="fa-solid fa-person-running"></i> Legs & Power
            </button>
            <button onclick="switchBranch('balance')" id="tab-balance" class="branch-tab px-4 py-2.5 rounded-xl font-bold text-sm whitespace-nowrap transition flex items-center gap-2 bg-slate-800/80 text-slate-400 hover:bg-slate-800 hover:text-slate-200">
                <i class="fa-solid fa-scale-balanced"></i> Balance & Static
            </button>
        </nav>

        <!-- Skill Tree Nodes Container -->
        <section id="skill-tree-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Skill Nodes dynamically populated by JS -->
        </section>

    </main>

    <!-- -->
    <!-- QUEST EXECUTION MODAL / OVERLAY SCREEN -->
    <!-- FIXED: Added pt-12, top-safe, and independent max-height scrolling container to ensure controls are never cut off -->
    <div id="quest-modal" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-xl flex flex-col hidden transition-opacity duration-300">
        
        <!-- STICKY TOP HEADER CONTROL BAR (Fixed clearance for iOS Notch & Control Buttons) -->
        <header class="sticky top-0 z-20 bg-slate-900 border-b border-slate-800 px-4 py-3 sm:px-6 pt-safe shadow-2xl flex-none">
            <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
                
                <!-- Left: Cancel Quest Button -->
                <button onclick="cancelQuest()" class="px-3 py-1.5 rounded-lg bg-red-950/60 hover:bg-red-900 text-red-300 border border-red-800/80 text-xs font-bold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-xmark text-sm"></i>
                    <span>Cancel Quest</span>
                </button>

                <!-- Center: Quest Title & Rest Timer Indicator -->
                <div class="text-center flex-1 min-w-0">
                    <h3 id="quest-title-text" class="text-sm sm:text-base font-extrabold text-amber-400 truncate">ACTIVE QUEST</h3>
                    <div id="modal-rest-timer-badge" class="hidden inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-amber-500/20 border border-amber-500/40 text-amber-300 text-xs font-mono font-bold timer-pulse">
                        <i class="fa-solid fa-stopwatch text-xs"></i> REST: <span id="modal-rest-time">60</span>s
                    </div>
                </div>

                <!-- Right: Progress Tracker -->
                <div class="text-right flex-none">
                    <span class="text-xs text-slate-400 block font-semibold">PROGRESS</span>
                    <span id="quest-progress-text" class="text-xs sm:text-sm font-black text-slate-200">0 / 0 Sets</span>
                </div>
            </div>

            <!-- Overall Quest Progress Bar Line -->
            <div class="max-w-3xl mx-auto w-full bg-slate-800 h-1.5 rounded-full mt-2.5 overflow-hidden">
                <div id="quest-modal-progress-bar" class="bg-amber-400 h-full w-0 transition-all duration-300"></div>
            </div>
        </header>

        <!-- INDEPENDENTLY SCROLLABLE EXERCISE CONTENT CONTAINER -->
        <!-- FIXED: Added flex-1 overflow-y-auto max-h-screen container so workout list scrolls smoothly below header -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-6 pb-24 max-w-3xl w-full mx-auto space-y-6">
            
            <!-- Rest Timer Controller Banner (Inside Scroll View) -->
            <div id="rest-timer-card" class="hidden bg-slate-900/90 border border-amber-500/40 rounded-2xl p-4 text-center space-y-2 shadow-lg">
                <div class="text-xs font-bold uppercase tracking-widest text-amber-400">Rest Interval Active</div>
                <div id="rest-timer-display" class="text-4xl font-mono font-black text-amber-300">01:00</div>
                <div class="flex justify-center gap-2 pt-1">
                    <button onclick="addRestTime(15)" class="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 border border-slate-700">+15s</button>
                    <button onclick="skipRestTime()" class="px-3 py-1 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-xs font-semibold text-amber-300 border border-amber-500/30">Skip Rest</button>
                </div>
            </div>

            <!-- List of Exercises in Quest -->
            <div id="quest-exercise-list" class="space-y-4">
                <!-- Dynamically Rendered Exercise Cards -->
            </div>
        </div>

        <!-- STICKY BOTTOM ACTION FOOTER -->
        <footer class="fixed bottom-0 left-0 right-0 z-20 bg-slate-900/95 border-t border-slate-800 p-4 pb-safe backdrop-blur-lg">
            <div class="max-w-3xl mx-auto flex items-center justify-between gap-4">
                <div class="text-xs text-slate-400">
                    Reward: <span id="quest-reward-xp" class="text-amber-400 font-bold text-sm">+50 XP</span>
                </div>
                <button id="finish-quest-btn" onclick="completeQuest()" disabled class="px-6 py-3 rounded-xl bg-slate-800 text-slate-500 font-extrabold text-sm border border-slate-700 disabled:opacity-50 transition flex items-center gap-2">
                    <i class="fa-solid fa-trophy"></i> Complete Quest
                </button>
            </div>
        </footer>
    </div>

    <!-- NOTIFICATION TOAST OVERLAY -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- -->
    <script>
        /* ==========================================================================
           1. DATA STRUCTURES & SKILL TREE CONFIGURATION
           ========================================================================== */
        
        // Skill Database covering 5 Branches with tier progressions
        const SKILL_TREE = {
            push: [

                { id: 'incline_pushup', name: 'Incline Push-Ups', tier: 2, xpReq: 50, reqs: ['wall_pushup'], desc: 'Elevated push-ups building chest and triceps stability.' },
                { id: 'knee_pushup', name: 'Knee Push-Ups', tier: 3, xpReq: 120, reqs: ['incline_pushup'], desc: 'Horizontal pushing with partial bodyweight load.' },
                { id: 'standard_pushup', name: 'Standard Push-Ups', tier: 4, xpReq: 250, reqs: ['knee_pushup'], desc: 'Strict horizontal bodyweight press.' },
                { id: 'diamond_pushup', name: 'Diamond Push-Ups', tier: 5, xpReq: 450, reqs: ['standard_pushup'], desc: 'Close-grip push-ups targeting triceps and inner chest.' },
                { id: 'pike_pushup', name: 'Pike Push-Ups', tier: 5, xpReq: 500, reqs: ['standard_pushup'], desc: 'Vertical shoulder pressing progression.' },
                { id: 'decline_pushup', name: 'Decline Push-Ups', tier: 6, xpReq: 650, reqs: ['diamond_pushup'], desc: 'Elevated feet push-ups increasing upper chest strain.' },
                { id: 'dip_bars', name: 'Parallel Bar Dips', tier: 7, xpReq: 900, reqs: ['decline_pushup', 'pike_pushup'], desc: 'Full bodyweight vertical dip.' },
                { id: 'hspu_wall', name: 'Wall Handstand Push-Up', tier: 8, xpReq: 1300, reqs: ['dip_bars'], desc: 'Full shoulder strength and overhead stability.' }
            ],
            pull: [
                { id: 'wall_pull', name: 'Doorframe Pulls', tier: 1, xpReq: 0, reqs: [], desc: 'Initial upper back engagement.' },
                { id: 'incline_row', name: 'Incline Australian Rows', tier: 2, xpReq: 60, reqs: ['wall_pull'], desc: 'Horizontal bodyweight row under high bar.' },
                { id: 'horizontal_row', name: 'Horizontal Bodyweight Rows', tier: 3, xpReq: 150, reqs: ['incline_row'], desc: 'Flat body horizontal pulling for scapular strength.' },
                { id: 'scapular_pull', name: 'Scapular Pull-Ups', tier: 4, xpReq: 280, reqs: ['horizontal_row'], desc: 'Deadhang scapular retractions on overhead bar.' },
                { id: 'negative_pullup', name: 'Negative Pull-Ups', tier: 5, xpReq: 450, reqs: ['scapular_pull'], desc: 'Slow 5-second eccentric drops from bar.' },
                { id: 'standard_pullup', name: 'Strict Pull-Ups', tier: 6, xpReq: 700, reqs: ['negative_pullup'], desc: 'Overhand grip full range pulling power.' },
                { id: 'chinup', name: 'Strict Chin-Ups', tier: 6, xpReq: 700, reqs: ['negative_pullup'], desc: 'Underhand biceps-focused pull.' },
                { id: 'archer_pullup', name: 'Archer Pull-Ups', tier: 7, xpReq: 1100, reqs: ['standard_pullup'], desc: 'Asymmetrical pull targeting unilateral lat power.' },
                { id: 'muscle_up', name: 'Bar Muscle-Up', tier: 8, xpReq: 1600, reqs: ['archer_pullup'], desc: 'Explosive pull-to-dip transition.' }
            ],
            core: [
                { id: 'plank_knee', name: 'Knee Plank Hold', tier: 1, xpReq: 0, reqs: [], desc: 'Core anti-extension hold.' },
                { id: 'plank_full', name: 'Full Forearm Plank', tier: 2, xpReq: 50, reqs: ['plank_knee'], desc: 'Standard 60s core stability benchmark.' },
                { id: 'lying_leg_raise', name: 'Lying Leg Raises', tier: 3, xpReq: 120, reqs: ['plank_full'], desc: 'Lower abdominal strength builder.' },
                { id: 'hollow_body', name: 'Hollow Body Hold', tier: 4, xpReq: 250, reqs: ['lying_leg_raise'], desc: 'Gymnastic core dish hold position.' },
                { id: 'hanging_knee_raise', name: 'Hanging Knee Raises', tier: 5, xpReq: 450, reqs: ['hollow_body'], desc: 'Grip and lower ab compression.' },
                { id: 'hanging_leg_raise', name: 'Hanging Straight Leg Raises', tier: 6, xpReq: 750, reqs: ['hanging_knee_raise'], desc: 'Toes to bar strict hanging raise.' },
                { id: 'l_sit_tuck', name: 'Tuck L-Sit Hold', tier: 7, xpReq: 1000, reqs: ['hanging_leg_raise'], desc: 'Isometric dip bar compression hold.' },
                { id: 'l_sit_full', name: 'Full L-Sit Hold', tier: 8, xpReq: 1400, reqs: ['l_sit_tuck'], desc: 'Straight leg 90-degree hold.' }
            ],
            legs: [
                { id: 'box_squat', name: 'Assisted Box Squats', tier: 1, xpReq: 0, reqs: [], desc: 'Lower body mobility and knee path tracking.' },
                { id: 'air_squat', name: 'Bodyweight Air Squats', tier: 2, xpReq: 40, reqs: ['box_squat'], desc: 'Full depth bodyweight squatting.' },
                { id: 'lunges', name: 'Walking Lunges', tier: 3, xpReq: 100, reqs: ['air_squat'], desc: 'Unilateral quad and glute strength.' },
                { id: 'bulgarian_squat', name: 'Bulgarian Split Squats', tier: 4, xpReq: 220, reqs: ['lunges'], desc: 'Single-leg elevated rear squat.' },
                { id: 'calf_raises', name: 'Single-Leg Calf Raises', tier: 4, xpReq: 200, reqs: ['air_squat'], desc: 'Ankle stability and calf hypertrophy.' },
                { id: 'tuck_jumps', name: 'Explosive Tuck Jumps', tier: 5, xpReq: 400, reqs: ['bulgarian_squat'], desc: 'Plyometric leg power generator.' },
                { id: 'shrimp_squat', name: 'Shrimp Squats', tier: 6, xpReq: 700, reqs: ['tuck_jumps'], desc: 'Advanced unilateral bodyweight squat.' },
                { id: 'pistol_squat', name: 'Pistol Squat', tier: 7, xpReq: 1100, reqs: ['shrimp_squat'], desc: 'Full depth single leg squat with anterior balance.' }
            ],
            balance: [
                { id: 'wall_plank', name: 'Wall Feet Hold', tier: 1, xpReq: 0, reqs: [], desc: 'Overhead shoulder endurance against wall.' },
                { id: 'crow_pose', name: 'Crow Pose Hold', tier: 2, xpReq: 80, reqs: ['wall_plank'], desc: 'Arm balance and wrist strength foundation.' },
                { id: 'wall_handstand', name: 'Chest-To-Wall Handstand', tier: 3, xpReq: 200, reqs: ['crow_pose'], desc: 'Strict alignment handstand against wall.' },
                { id: 'kickup_attempts', name: 'Freestanding Kick-Up Holds', tier: 4, xpReq: 450, reqs: ['wall_handstand'], desc: 'Bail practice and freestanding control.' },
                { id: 'handstand_freestanding', name: 'Freestanding Handstand (10s)', tier: 5, xpReq: 800, reqs: ['kickup_attempts'], desc: '10 second unassisted handstand.' },
                { id: 'elbow_lever', name: 'Elbow Lever Hold', tier: 6, xpReq: 1100, reqs: ['handstand_freestanding'], desc: 'Horizontal body balance on elbows.' }
            ]
        };

        // Player State Storage Structure
        let gameState = {
            xp: 0,
            level: 1,
            unlockedSkills: ['wall_pushup', 'wall_pull', 'plank_knee', 'box_squat', 'wall_plank'],
            skillProficiency: {}, // tracks sets/reps completed per skill
            currentBranch: 'push',
            activeQuest: null
        };

        let restTimerInterval = null;
        let restTimeRemaining = 0;

        /* ==========================================================================
           2. INITIALIZATION & STORAGE ENGINE
           ========================================================================== */
        window.onload = function() {
            loadGameData();
            updateUI();
            renderSkillTree();
        };

        function saveGameData() {
            try {
                localStorage.setItem('cali_rpg_data', JSON.stringify(gameState));
            } catch (e) {
                console.error("Local storage error:", e);
            }
        }

        function loadGameData() {
            const saved = localStorage.getItem('cali_rpg_data');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    gameState = { ...gameState, ...parsed };
                } catch (e) {
                    console.error("Failed to parse saved data:", e);
                }
            }
        }

        function confirmReset() {
            if (confirm("Are you sure you want to reset your character? All level progress and skill unlocks will be cleared.")) {
                localStorage.removeItem('cali_rpg_data');
                location.reload();
            }
        }

        /* ==========================================================================
           3. UI UPDATER & LEVEL CALCULATION
           ========================================================================== */
        function getRequiredXP(level) {
            return Math.floor(100 * Math.pow(1.25, level - 1));
        }

        function getRankName(level) {
            if (level < 3) return "Novice Initiate";
            if (level < 6) return "Apprentice Athlete";
            if (level < 10) return "Journeyman Gymnastic";
            if (level < 15) return "Master Practitioner";
            return "Grandmaster Calisthenic";
        }

        function updateUI() {
            // Level Calculation
            let reqXP = getRequiredXP(gameState.level);
            while (gameState.xp >= reqXP) {
                gameState.xp -= reqXP;
                gameState.level++;
                reqXP = getRequiredXP(gameState.level);
                showToast(`LEVEL UP! You reached Level ${gameState.level}!`, 'success');
            }

            // Update DOM Elements
            document.getElementById('level-num').innerText = gameState.level;
            document.getElementById('mobile-level-num').innerText = gameState.level;
            document.getElementById('current-xp').innerText = gameState.xp;
            document.getElementById('next-level-xp').innerText = reqXP;
            document.getElementById('player-rank').innerText = getRankName(gameState.level);

            const xpPercentage = Math.min(100, Math.floor((gameState.xp / reqXP) * 100));
            document.getElementById('xp-bar-fill').style.width = `${xpPercentage}%`;

            saveGameData();
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgClass = type === 'success' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-100 border border-slate-700';
            
            toast.className = `px-4 py-3 rounded-xl shadow-2xl ${bgClass} text-sm flex items-center gap-2 pointer-events-auto transition-all duration-300 transform translate-y-2 opacity-0`;
            toast.innerHTML = `<i class="fa-solid fa-circle-info"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        /* ==========================================================================
           4. SKILL TREE RENDERER & UNLOCK ENGINE
           ========================================================================== */
        function switchBranch(branch) {
            gameState.currentBranch = branch;
            
            document.querySelectorAll('.branch-tab').forEach(tab => {
                tab.classList.remove('bg-amber-500', 'text-slate-950', 'shadow-md');
                tab.classList.add('bg-slate-800/80', 'text-slate-400');
            });

            const activeTab = document.getElementById(`tab-${branch}`);
            if (activeTab) {
                activeTab.classList.remove('bg-slate-800/80', 'text-slate-400');
                activeTab.classList.add('bg-amber-500', 'text-slate-950', 'shadow-md');
            }

            renderSkillTree();
        }

        function isSkillUnlocked(skillId) {
            return gameState.unlockedSkills.includes(skillId);
        }

        function canUnlockSkill(skill) {
            if (isSkillUnlocked(skill.id)) return false;
            // Check prerequisites
            const reqsMet = skill.reqs.every(reqId => gameState.unlockedSkills.includes(reqId));
            return reqsMet;
        }

        function unlockSkill(skillId) {
            const branchSkills = SKILL_TREE[gameState.currentBranch];
            const skill = branchSkills.find(s => s.id === skillId);

            if (!skill) return;

            if (canUnlockSkill(skill)) {
                gameState.unlockedSkills.push(skillId);
                showToast(`Unlocked Skill: ${skill.name}!`, 'success');
                updateUI();
                renderSkillTree();
            } else {
                showToast("Prerequisite skills required first!", "error");
            }
        }

        function renderSkillTree() {
            const container = document.getElementById('skill-tree-container');
            container.innerHTML = '';

            const skills = SKILL_TREE[gameState.currentBranch] || [];

            skills.forEach(skill => {
                const unlocked = isSkillUnlocked(skill.id);
                const available = canUnlockSkill(skill);

                const card = document.createElement('div');
                
                let borderClass = 'border-slate-800 bg-slate-900/60 opacity-75';
                let statusBadge = `<span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-500 font-semibold"><i class="fa-solid fa-lock text-xs"></i> Locked</span>`;
                
                if (unlocked) {
                    borderClass = 'border-amber-500/50 bg-slate-900 shadow-lg shadow-amber-500/5';
                    statusBadge = `<span class="text-xs px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30 font-semibold"><i class="fa-solid fa-circle-check text-xs"></i> Mastered</span>`;
                } else if (available) {
                    borderClass = 'border-amber-400/80 bg-slate-850 hover:border-amber-400 transition cursor-pointer';
                    statusBadge = `<span class="text-xs px-2 py-0.5 rounded bg-yellow-500/20 text-yellow-300 border border-yellow-500/30 font-semibold animate-pulse">Ready to Unlock</span>`;
                }

                card.className = `rounded-2xl p-4 border ${borderClass} flex flex-col justify-between gap-3 relative overflow-hidden`;
                
                card.innerHTML = `
                    <div class="space-y-2">
                        <div class="flex items-start justify-between gap-2">
                            <div>
                                <span class="text-xs font-mono text-slate-400 uppercase tracking-wider">Tier ${skill.tier}</span>
                                <h4 class="text-base font-bold text-slate-100 leading-snug">${skill.name}</h4>
                            </div>
                            ${statusBadge}
                        </div>
                        <p class="text-xs text-slate-400 leading-relaxed">${skill.desc}</p>
                    </div>

                    <div class="pt-2 border-t border-slate-800/80 flex items-center justify-between">
                        ${unlocked ? `
                            <button onclick="logQuickSet('${skill.id}')" class="w-full py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold text-xs border border-slate-700 transition flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-plus text-xs"></i> Log Practice Set (+15 XP)
                            </button>
                        ` : available ? `
                            <button onclick="unlockSkill('${skill.id}')" class="w-full py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs shadow-md transition">
                                Unlock Skill Node
                            </button>
                        ` : `
                            <div class="text-xs text-slate-500 flex items-center gap-1">
                                <i class="fa-solid fa-link text-xs"></i> Requires: ${skill.reqs.map(r => getSkillNameById(r)).join(', ')}
                            </div>
                        `}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function getSkillNameById(id) {
            for (let branch in SKILL_TREE) {
                const found = SKILL_TREE[branch].find(s => s.id === id);
                if (found) return found.name;
            }
            return id;
        }

        function logQuickSet(skillId) {
            gameState.xp += 15;
            showToast("Practice set logged! +15 XP", "success");
            updateUI();
        }

        /* ==========================================================================
           5. QUEST GENERATOR & EXECUTION MODAL ENGINE
           ========================================================================== */
        function generateWorkoutQuest() {
            const focus = document.getElementById('quest-focus-select').value;
            let eligibleSkills = [];

            if (focus === 'full') {
                for (let branch in SKILL_TREE) {
                    const unlockedInBranch = SKILL_TREE[branch].filter(s => gameState.unlockedSkills.includes(s.id));
                    if (unlockedInBranch.length > 0) {
                        eligibleSkills.push(unlockedInBranch[unlockedInBranch.length - 1]); // peak unlocked skill
                    }
                }
            } else {
                const branchSkills = SKILL_TREE[focus] || [];
                eligibleSkills = branchSkills.filter(s => gameState.unlockedSkills.includes(s.id));
            }

            if (eligibleSkills.length === 0) {
                showToast("No unlocked skills found for this focus type!", "error");
                return;
            }

            // Build quest structure (3 sets per exercise)
            const questExercises = eligibleSkills.map(skill => ({
                id: skill.id,
                name: skill.name,
                totalSets: 3,
                completedSets: 0,
                targetReps: '8 - 12 Reps'
            }));

            gameState.activeQuest = {
                title: `${focus.toUpperCase()} SPEC - REGIMEN`,
                exercises: questExercises,
                totalSetsCount: questExercises.length * 3,
                completedSetsCount: 0,
                rewardXP: questExercises.length * 25 + 50
            };

            openQuestModal();
        }

        function openQuestModal() {
            const modal = document.getElementById('quest-modal');
            modal.classList.remove('hidden');

            document.getElementById('quest-title-text').innerText = gameState.activeQuest.title;
            document.getElementById('quest-reward-xp').innerText = `+${gameState.activeQuest.rewardXP} XP`;
            
            renderQuestExercises();
            updateQuestModalProgress();
        }

        function renderQuestExercises() {
            const container = document.getElementById('quest-exercise-list');
            container.innerHTML = '';

            gameState.activeQuest.exercises.forEach((ex, exIdx) => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-md";

                let setButtonsHTML = '';
                for (let s = 1; s <= ex.totalSets; s++) {
                    const isDone = s <= ex.completedSets;
                    const btnClass = isDone 
                        ? 'bg-amber-500 text-slate-950 font-bold border-amber-400' 
                        : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-750';

                    setButtonsHTML += `
                        <button onclick="toggleQuestSet(${exIdx}, ${s})" class="flex-1 py-2 rounded-xl border text-xs font-bold transition flex items-center justify-center gap-1 ${btnClass}">
                            ${isDone ? '<i class="fa-solid fa-check"></i>' : ''} Set ${s}
                        </button>
                    `;
                }

                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div>
                            <h4 class="font-bold text-slate-100 text-sm sm:text-base">${ex.name}</h4>
                            <p class="text-xs text-slate-400">Target: <span class="text-amber-300 font-semibold">${ex.targetReps}</span></p>
                        </div>
                        <span class="text-xs font-mono font-bold text-slate-400 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700">
                            ${ex.completedSets} / ${ex.totalSets} Done
                        </span>
                    </div>

                    <div class="flex items-center gap-2 pt-1">
                        ${setButtonsHTML}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function toggleQuestSet(exerciseIdx, setNum) {
            const ex = gameState.activeQuest.exercises[exerciseIdx];
            
            if (setNum <= ex.completedSets) {
                ex.completedSets--;
                gameState.activeQuest.completedSetsCount--;
            } else {
                ex.completedSets++;
                gameState.activeQuest.completedSetsCount++;
                startRestTimer(60); // 60s Rest interval on set completion
            }

            renderQuestExercises();
            updateQuestModalProgress();
        }

        function updateQuestModalProgress() {
            const total = gameState.activeQuest.totalSetsCount;
            const done = gameState.activeQuest.completedSetsCount;

            document.getElementById('quest-progress-text').innerText = `${done} / ${total} Sets`;

            const pct = Math.min(100, Math.floor((done / total) * 100));
            document.getElementById('quest-modal-progress-bar').style.width = `${pct}%`;

            const finishBtn = document.getElementById('finish-quest-btn');
            if (done === total) {
                finishBtn.disabled = false;
                finishBtn.className = "px-6 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-extrabold text-sm shadow-xl shadow-amber-500/20 transition cursor-pointer active:scale-95 flex items-center gap-2";
            } else {
                finishBtn.disabled = true;
                finishBtn.className = "px-6 py-3 rounded-xl bg-slate-800 text-slate-500 font-extrabold text-sm border border-slate-700 disabled:opacity-50 transition flex items-center gap-2";
            }
        }

        /* ==========================================================================
           6. REST TIMER & AUDIO SOUND ENGINE
           ========================================================================== */
        function startRestTimer(seconds) {
            clearInterval(restTimerInterval);
            restTimeRemaining = seconds;

            const card = document.getElementById('rest-timer-card');
            const badge = document.getElementById('modal-rest-timer-badge');
            
            card.classList.remove('hidden');
            badge.classList.remove('hidden');

            updateTimerDisplay();

            restTimerInterval = setInterval(() => {
                restTimeRemaining--;
                updateTimerDisplay();

                if (restTimeRemaining <= 0) {
                    clearInterval(restTimerInterval);
                    playBeepSound();
                    card.classList.add('hidden');
                    badge.classList.add('hidden');
                    showToast("Rest Over! Time for your next set.", "info");
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(restTimeRemaining / 60);
            const secs = restTimeRemaining % 60;
            const formatted = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            document.getElementById('rest-timer-display').innerText = formatted;
            document.getElementById('modal-rest-time').innerText = restTimeRemaining;
        }

        function addRestTime(secs) {
            restTimeRemaining += secs;
            updateTimerDisplay();
        }

        function skipRestTime() {
            clearInterval(restTimerInterval);
            document.getElementById('rest-timer-card').classList.add('hidden');
            document.getElementById('modal-rest-timer-badge').classList.add('hidden');
        }

        function playBeepSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime); // A5 note
                gain.gain.setValueAtTime(0.1, ctx.currentTime);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) {
                console.log("Audio not supported or allowed without interaction.");
            }
        }

        function cancelQuest() {
            if (confirm("Cancel active quest? Progress will be lost.")) {
                clearInterval(restTimerInterval);
                document.getElementById('quest-modal').classList.add('hidden');
                gameState.activeQuest = null;
            }
        }

        function completeQuest() {
            if (!gameState.activeQuest) return;

            clearInterval(restTimerInterval);
            const reward = gameState.activeQuest.rewardXP;
            
            gameState.xp += reward;
            gameState.activeQuest = null;

            document.getElementById('quest-modal').classList.add('hidden');
            
            showToast(`QUEST COMPLETED! +${reward} XP Earned!`, 'success');
            updateUI();
        }

        /* ==========================================================================
           7. DATA BACKUP & RESTORE ENGINE
           ========================================================================== */
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(gameState));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `cali_rpg_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchorElem);
            dlAnchorElem.click();
            dlAnchorElem.remove();
        }

        function importData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const importedState = JSON.parse(e.target.result);
                    if (importedState && importedState.unlockedSkills) {
                        gameState = importedState;
                        saveGameData();
                        updateUI();
                        renderSkillTree();
                        showToast("Progress successfully restored!", "success");
                    } else {
                        showToast("Invalid backup file format.", "error");
                    }
                } catch (err) {
                    showToast("Error reading JSON file.", "error");
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }
    </script>
